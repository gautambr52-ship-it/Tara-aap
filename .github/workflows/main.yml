name: Build Tara APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Tara project
        run: |
          unzip -o Tara_Android_Project.zip -d tara_project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p tara_project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tara-debug-APK
          path: tara_project/app/build/outputs/apk/debug/app-debug.apk
